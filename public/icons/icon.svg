<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <linearGradient id="neonLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#76FF03"/>
    </linearGradient>
    <linearGradient id="catOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAB19"/>
      <stop offset="100%" stop-color="#FF6D00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1E293B" stroke-width="4"/>

  <!-- Dopamine Circuit Lines -->
  <path d="M 80 160 H 200 V 220" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" opacity="0.4" fill="none"/>
  <circle cx="200" cy="220" r="8" fill="#00E5FF" opacity="0.8"/>
  <path d="M 432 352 H 312 V 292" stroke="#FF2A85" stroke-width="6" stroke-linecap="round" opacity="0.4" fill="none"/>
  <circle cx="312" cy="292" r="8" fill="#FF2A85" opacity="0.8"/>

  <!-- Scratch Flag Icon Shape (Dopamine Green) -->
  <g transform="translate(140, 90)">
    <!-- Flag pole -->
    <rect x="0" y="0" width="12" height="150" rx="6" fill="#64748B" />
    <!-- Flag banner with 3D feel -->
    <path d="M 12 10 Q 70 -5 130 18 Q 180 35 220 15 L 220 100 Q 170 120 120 100 Q 70 85 12 105 Z" 
          fill="url(#neonLime)" filter="url(#glow)"/>
    <polygon points="40,35 40,85 85,60" fill="#064E3B"/>
  </g>

  <!-- Geek Code Block / Puzzle Icon -->
  <g transform="translate(106, 270)">
    <rect width="300" height="130" rx="24" fill="#4C97FF" />
    <!-- 3D bottom edge -->
    <rect y="112" width="300" height="18" rx="9" fill="#2563EB" />
    <!-- Scratch puzzle notch -->
    <path d="M 40 0 L 55 16 L 85 16 L 100 0 Z" fill="#0F172A" />
    <!-- Block text symbols -->
    <text x="50" y="75" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF">
      STEM · 迈出第一步
    </text>
    <circle cx="260" cy="65" r="14" fill="#FFD000" />
  </g>

  <!-- Sparkles -->
  <polygon points="100,100 106,118 124,124 106,130 100,148 94,130 76,124 94,118" fill="#FFD000"/>
  <polygon points="420,180 424,192 436,196 424,200 420,212 416,200 404,196 416,192" fill="#00E5FF"/>
</svg>
